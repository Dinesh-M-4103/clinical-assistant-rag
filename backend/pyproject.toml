[project]
name = "clinical-assistant-backend"
version = "0.1.0"
description = "Patient-scoped medical-records RAG API (FastAPI + ChromaDB + hybrid retrieval + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "sse-starlette>=2.1",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: loads real ML models", "live: calls the real LLM API"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
